<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seed Gallery</title>
<style>
body { font-family: system-ui, sans-serif; margin: 24px; color: #333; }
h1 { margin-bottom: 4px; }
p.note { margin: 0 0 20px; font-size: 13px; color: #777; }
.grid { display: flex; flex-wrap: wrap; gap: 16px; }
.seed-card { display: flex; flex-direction: column; align-items: center; }
.seed-card img { display: block; width: 175px; height: 200px; border: 1px solid #eee; }
.card-label { font-size: 11px; color: #555; text-align: center; margin-top: 4px; line-height: 1.6; }
.card-label strong { color: #222; }
</style>
</head>
<body>
<h1>Seed Gallery</h1>
<p class="note">Screened data seeds as null dot plot pairs, sorted by Kolmogorov-Smirnov distance ascending.</p>
<div id="gallery" class="grid"></div>
<script>

    "seed_22300000_ks0.140.png",
    "seed_22600000_ks0.140.png",
    "seed_22700000_ks0.160.png",
];

const entries = FILES.map(f => {
    const m = f.match(/seed_(\d+)_ks([\d.]+)\.png/);
    return {file: f, seed: m[1], ks: parseFloat(m[2])};
});

entries.sort((a, b) => a.ks - b.ks || a.seed - b.seed);

const gallery = document.getElementById("gallery");

for (const {file, seed, ks} of entries) {
    const img = document.createElement("img");
    img.src  = `seed_gallery/${file}`;
    img.alt  = file;

    const label = document.createElement("div");
    label.className = "card-label";
    label.innerHTML = `<strong>${Number(seed).toLocaleString()}</strong><br>KS = ${ks.toFixed(3)}`;

    const card = document.createElement("div");
    card.className = "seed-card";
    card.appendChild(img);
    card.appendChild(label);
    gallery.appendChild(card);
}
</script>
</body>
</html>
